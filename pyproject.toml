[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "dabao-sdk-tools"
version = "0.1.0"
description = "Command line tools for the Dabao SDK (Baochip-1x): UF2 signing, serial flashing and forbidden address auditing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pyserial",
    "pure25519",
    "reportlab",
]

[project.urls]
Homepage = "https://github.com/ArmstrongSubero/dabao-sdk"

[project.scripts]
dabao-audit-addresses = "dabao_sdk_tools.audit_addresses:main"
dabao-serial-flash = "dabao_sdk_tools.serial_flash:main"
dabao-sign-and-uf2 = "dabao_sdk_tools.sign_and_uf2:main"
dabao-board-vs-emu = "dabao_sdk_tools.board_vs_emu:main"

[tool.pdm.build]
package-dir = "."
includes = [
    "dabao_sdk_tools",
]
